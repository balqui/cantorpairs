[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cantorpairs"
dynamic = ["version"] # instead of version = "1.3"
authors = [
    { name = "José Luis Balcázar", email = "jose.luis.balcazar@upc.edu" }
]
description = "Pairing and tupling and sequencing with Cantor-like encodings and maybe more"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [ ]

[project.urls]
"Homepage" = "https://github.com/balqui/cantorpairs"
"Bug Tracker" = "https://github.com/balqui/cantorpairs/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "your_package_name.__version__"}
